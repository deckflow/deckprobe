name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  js-package:
    name: Browser SDK package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/deckprobe-js/package-lock.json
      - name: Install JavaScript dependencies
        working-directory: packages/deckprobe-js
        run: npm ci
      - name: Build WASM and TypeScript package
        working-directory: packages/deckprobe-js
        run: npm run build
      - name: Install Chromium
        working-directory: packages/deckprobe-js
        run: npx playwright install --with-deps chromium
      - name: Run Browser SDK contract tests
        working-directory: packages/deckprobe-js
        run: npm test
      - name: Audit JavaScript dependencies
        working-directory: packages/deckprobe-js
        run: npm audit --audit-level=high
      - name: Verify package contents
        working-directory: packages/deckprobe-js
        run: npm pack --dry-run --json
