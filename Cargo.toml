[workspace]
members = [
    "crates/deckprobe-core",
    "crates/deckprobe-engine",
    "crates/deckprobe-wasm",
    "crates/deckprobe-format-pdf",
    "crates/deckprobe-format-ooxml",
    "crates/deckprobe-format-word",
    "crates/deckprobe-format-excel",
    "crates/deckprobe-format-powerpoint",
    "crates/deckprobe-format-office-legacy",
    "crates/deckprobe-format-iwork",
    "crates/deckprobe-cli",
]
resolver = "2"

[workspace.package]
version = "2.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/deckflow/deckprobe"
rust-version = "1.88"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
lopdf = "0.38"
office_oxide = "0.1.8"
quick-xml = "0.38"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
snap = "1"
thiserror = "2"
wasm-bindgen = "0.2"
web-time = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# The profile used by cargo-dist for downloadable release binaries.
[profile.dist]
inherits = "release"
lto = "thin"
